<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title (SEO – very important) -->
    <title>Hayat Eye Center | Best Eye Hospital & Eye Doctor in Aligarh</title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Hayat Eye Center is a leading eye hospital in Aligarh providing advanced eye care, cataract surgery, LASIK, retina treatment, and expert ophthalmology services."
    />

    <!-- Keywords (Local SEO support) -->
    <meta
      name="keywords"
      content="Hayat Eye Center, eye hospital in Aligarh, best eye doctor Aligarh, cataract surgery Aligarh, LASIK eye surgery, ophthalmologist near me"
    />

    <!-- Author -->
    <meta name="author" content="Hayat Eye Center" />

    <!-- Canonical URL (VERY IMPORTANT FOR SEO) -->
    <link rel="canonical" href="https://hayateyecenter.com/" />

    <!-- Favicon (Correct & Deployment Safe) -->
    <link rel="icon" type="image/png" href="/images/hayatLogo.png" />
    <link rel="apple-touch-icon" href="/images/hayatLogo.png" />
    <link rel="shortcut icon" href="/images/hayatLogo.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Preconnect Fonts (Performance + CLS fix) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:title" content="Hayat Eye Center | Trusted Eye Care in Aligarh" />
    <meta
      property="og:description"
      content="Expert eye care services including LASIK, cataract surgery, and retina treatment at Hayat Eye Center, Aligarh."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hayateyecenter.com/" />
    <meta
      property="og:image"
      content="https://hayateyecenter.com/images/hayatLogo.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hayat Eye Center | Eye Hospital in Aligarh" />
    <meta
      name="twitter:description"
      content="Advanced eye care, LASIK & cataract surgery by experienced eye specialists in Aligarh."
    />
    <meta
      name="twitter:image"
      content="https://hayateyecenter.com/images/hayatLogo.png"
    />

    <!-- Structured Data (Medical Organization – HIGH SEO VALUE) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalOrganization",
        "name": "Hayat Eye Center",
        "url": "https://hayateyecenter.com/",
        "logo": "https://hayateyecenter.com/images/hayatLogo.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Aligarh",
          "addressRegion": "Uttar Pradesh",
          "addressCountry": "IN"
        },
        "medicalSpecialty": "Ophthalmology",
        "availableService": [
          "Eye Checkup",
          "Cataract Surgery",
          "LASIK Eye Surgery",
          "Retina Treatment"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Main React Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
